[tool.poetry]
name = "nn-arithmetic"
version = "0.1.0"
description = "Neural network arithmetic operations"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
pandas = ">=2.0.0"
numpy = ">=2.2.0,<2.3.0"
torch = {url = "https://download.pytorch.org/whl/cpu/torch-1.13.1-cp310-none-macosx_10_9_x86_64.whl"}

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
