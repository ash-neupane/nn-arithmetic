[tool.poetry]
name = "nn-arithmetic"
version = "0.1.0"
description = "Neural network arithmetic operations"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
pandas = ">=2.0.0"
numpy = ">=1.24.0,<2.0.0"
torch = {url = "https://download.pytorch.org/whl/cpu/torch-1.13.1-cp310-none-macosx_10_9_x86_64.whl"}
tqdm = "*"
wandb = "^0.23.0"
python-dotenv = "^1.2.1"
tokenizers = "^0.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
black = "*"
isort = "*"
pyright = "*"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
